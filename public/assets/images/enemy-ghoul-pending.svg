<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Enemy field capture pending</title>
  <desc id="desc">No clean enemy render is available in the game files. This evidence-frame placeholder does not depict the creature.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#240a0d"/>
      <stop offset="0.5" stop-color="#0c0c11"/>
      <stop offset="1" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e11d24" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#e11d24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#scan)"/>
  <ellipse cx="800" cy="440" rx="620" ry="380" fill="url(#glow)"/>

  <!-- frame -->
  <rect x="58" y="58" width="1484" height="784" fill="none" stroke="#b3121a" stroke-opacity="0.4"/>
  <path d="M58 138V58h80M1462 58h80v80M1542 762v80h-80M138 842H58v-80" fill="none" stroke="#e11d24" stroke-width="4"/>

  <!-- capture reticle -->
  <rect x="420" y="230" width="760" height="430" fill="#000000" fill-opacity="0.22" stroke="#e11d24" stroke-opacity="0.5" stroke-dasharray="12 12"/>
  <path d="M800 330v230M685 445h230" stroke="#e11d24" stroke-opacity="0.3"/>
  <circle cx="800" cy="445" r="118" fill="none" stroke="#e11d24" stroke-opacity="0.22" stroke-dasharray="2 10"/>

  <g font-family="Arial Narrow, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="420" font-size="70" font-weight="900" letter-spacing="4" fill="#ece7e1" opacity="0.92">FIELD CAPTURE</text>
    <text x="800" y="498" font-size="78" font-weight="900" letter-spacing="12" fill="#e11d24">PENDING</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle" fill="#a8a39d">
    <text x="800" y="548" font-size="14" letter-spacing="6">NO CLEAN ENEMY RENDER EXISTS IN THE SHIPPED ASSETS</text>
    <text x="800" y="576" font-size="12" letter-spacing="3" fill="#6f6b68">THIS FRAME DOES NOT DEPICT THE CREATURE.</text>
  </g>

  <!-- top labels -->
  <g font-family="Consolas, 'Courier New', monospace" fill="#ece7e1">
    <text x="88" y="120" font-size="15" letter-spacing="5" fill="#b3121a">EVIDENCE FRAME 01 / HOSTILE</text>
    <text x="1512" y="120" font-size="13" letter-spacing="4" text-anchor="end" fill="#a8a39d">SUBJECT: GHOUL</text>
  </g>

  <!-- bottom block -->
  <line x1="88" y1="722" x2="1512" y2="722" stroke="#ffffff" stroke-opacity="0.12"/>
  <g font-family="Consolas, 'Courier New', monospace" fill="#6f6b68">
    <text x="88" y="766" font-size="12" letter-spacing="4">DEVELOPER: REPLACE THIS FILE WITH A VERIFIED IN-GAME ENEMY CAPTURE.</text>
    <text x="88" y="792" font-size="12" letter-spacing="4" fill="#4f4b48">SUGGESTED NAME: assets/images/enemy-ghoul.webp</text>
    <text x="1512" y="792" font-size="12" letter-spacing="3" text-anchor="end" fill="#b3121a">STATUS: UNVERIFIED</text>
  </g>
</svg>
