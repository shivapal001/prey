<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Classified dossier portrait placeholder for Zara</title>
  <desc id="desc">No official character portrait exists in the game files. This is an editable placeholder, not an invented likeness.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#1a0a0d"/>
      <stop offset="0.55" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#050508"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#b3121a" opacity="0.22"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07070a" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#07070a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#07070a" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#dots)"/>
  <rect width="800" height="1000" fill="url(#scan)"/>

  <!-- viewfinder frame -->
  <rect x="46" y="46" width="708" height="908" fill="none" stroke="#b3121a" stroke-opacity="0.38"/>
  <path d="M46 110V46h64M690 46h64v64M754 890v64h-64M110 954H46v-64" fill="none" stroke="#e11d24" stroke-width="3"/>
  <path d="M400 300v400M200 500h400" stroke="#e11d24" stroke-opacity="0.18"/>
  <circle cx="400" cy="500" r="168" fill="none" stroke="#e11d24" stroke-opacity="0.28" stroke-dasharray="3 9"/>
  <circle cx="400" cy="500" r="6" fill="#e11d24" opacity="0.75"/>

  <!-- identity block -->
  <g font-family="Consolas, 'Courier New', monospace" fill="#ece7e1">
    <text x="76" y="118" font-size="15" letter-spacing="5" fill="#b3121a">FILE PTE-001 / SUBJECT RECORD</text>
    <text x="76" y="146" font-size="11" letter-spacing="4" fill="#a8a39d">PREY: THE ESCAPE — INTERNAL DOSSIER</text>
  </g>

  <g font-family="Arial Narrow, Arial, sans-serif" text-anchor="middle">
    <text x="400" y="660" font-size="84" font-weight="900" letter-spacing="2" fill="#ffffff" opacity="0.94">NO PORTRAIT</text>
    <text x="400" y="736" font-size="84" font-weight="900" letter-spacing="8" fill="#e11d24" opacity="0.9">ON FILE</text>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle" fill="#a8a39d">
    <text x="400" y="792" font-size="14" letter-spacing="6">FIRST-PERSON PROTAGONIST</text>
    <text x="400" y="822" font-size="12" letter-spacing="3" fill="#6f6b68">THE CAMERA IS HER EYES. SHE IS NEVER SHOWN.</text>
  </g>

  <!-- bottom block -->
  <rect x="46" y="846" width="708" height="108" fill="url(#fade)"/>
  <g font-family="Consolas, 'Courier New', monospace" fill="#6f6b68">
    <text x="76" y="902" font-size="11" letter-spacing="3">DEVELOPER PLACEHOLDER — NOT A CANONICAL LIKENESS.</text>
    <text x="76" y="924" font-size="11" letter-spacing="3">REPLACE THIS FILE WITH A VERIFIED CHARACTER RENDER.</text>
  </g>

  <!-- stamp -->
  <g transform="translate(585 860) rotate(-11)" opacity="0.72">
    <rect x="-128" y="-36" width="256" height="72" fill="none" stroke="#e11d24" stroke-width="4"/>
    <rect x="-118" y="-27" width="236" height="54" fill="none" stroke="#e11d24" stroke-width="1"/>
    <text x="0" y="9" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="26" font-weight="900" letter-spacing="5" fill="#e11d24">CLASSIFIED</text>
  </g>
</svg>
